version: 2

build:
  os: ubuntu-20.04
  tools:
    python: "3.8"

jobs:
  build:
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build documentation
        run: |
          make html
