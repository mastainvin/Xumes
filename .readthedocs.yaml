version: 2

build:
  os: ubuntu-20.04
  tools:
    python: "3.8"

python:
  install:
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py

jobs:
  prebuild:
    steps:
      - name: Install build dependencies
        run: python -m pip install --upgrade pip

  build:
    steps:
      - name: Build documentation
        run: make -C docs html
